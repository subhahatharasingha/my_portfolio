<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="recipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0b0f19"/>

  <!-- Phone / Card design -->
  <rect x="220" y="40" width="160" height="280" rx="20" fill="#1e293b" stroke="#ea580c" stroke-width="3"/>
  
  <!-- Notch/Speaker -->
  <rect x="270" y="48" width="60" height="6" rx="3" fill="#0f172a"/>
  
  <!-- Card image inside phone -->
  <rect x="235" y="70" width="130" height="100" rx="10" fill="url(#recipeGrad)"/>
  
  <!-- Pot / Bowl inside card image -->
  <path d="M 270,130 Q 300,160 330,130 Z" fill="#ffffff" opacity="0.9"/>
  <rect x="280" y="115" width="40" height="10" rx="2" fill="#ffffff" opacity="0.9"/>

  <!-- Details text inside phone -->
  <rect x="235" y="185" width="130" height="12" rx="3" fill="#334155"/>
  <rect x="235" y="205" width="90" height="10" rx="3" fill="#475569"/>
  <rect x="235" y="225" width="110" height="10" rx="3" fill="#475569"/>

  <!-- Interactive buttons in phone -->
  <circle cx="255" cy="275" r="15" fill="#ea580c"/>
  <circle cx="300" cy="275" r="15" fill="#334155"/>
  <circle cx="345" cy="275" r="15" fill="#334155"/>

  <!-- App Title text -->
  <text x="300" y="360" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">RECIPE MOBILE APP</text>
</svg>
