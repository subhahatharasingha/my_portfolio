<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <rect width="100%" height="100%" fill="#0b0f19"/>

  <!-- AI facial landmark mesh -->
  <g stroke="#3b82f6" stroke-width="1" opacity="0.4">
    <!-- Outer face boundary -->
    <path d="M 300,100 Q 200,120 220,240 Q 240,320 300,340 Q 360,320 380,240 Q 400,120 300,100 Z" fill="none"/>
    
    <!-- Eyes contours -->
    <ellipse cx="265" cy="180" rx="20" ry="12" fill="none"/>
    <ellipse cx="335" cy="180" rx="20" ry="12" fill="none"/>
    
    <!-- Nose bridge and base -->
    <path d="M 300,150 L 300,240 L 285,250 L 315,250 Z" fill="none"/>
    
    <!-- Mouth contour -->
    <path d="M 260,280 Q 300,300 340,280 Q 300,290 260,280 Z" fill="none"/>

    <!-- Mesh interconnects -->
    <line x1="265" y1="180" x2="300" y2="150"/>
    <line x1="335" y1="180" x2="300" y2="150"/>
    <line x1="265" y1="180" x2="300" y2="240"/>
    <line x1="335" y1="180" x2="300" y2="240"/>
    <line x1="220" y1="240" x2="260" y2="280"/>
    <line x1="380" y1="240" x2="340" y2="280"/>
    <line x1="300" y1="240" x2="300" y2="280"/>
  </g>

  <!-- Landmark points -->
  <g fill="#60a5fa">
    <circle cx="265" cy="180" r="4"/>
    <circle cx="335" cy="180" r="4"/>
    <circle cx="300" cy="150" r="4"/>
    <circle cx="300" cy="240" r="4"/>
    <circle cx="260" cy="280" r="4"/>
    <circle cx="340" cy="280" r="4"/>
  </g>

  <!-- Eye aspect ratio (EAR) warning flags -->
  <line x1="230" y1="160" x2="370" y2="160" stroke="#f87171" stroke-width="2" stroke-dasharray="4 2"/>
  <rect x="235" y="125" width="130" height="25" rx="4" fill="#ef4444" fill-opacity="0.9"/>
  <text x="300" y="141" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">EAR &lt; 0.25 (FATIGUE)</text>

  <!-- Camera overlay UI -->
  <text x="50" y="50" font-family="monospace" font-size="12" fill="#10b981" font-weight="bold">● REC [60 FPS]</text>
  <text x="550" y="50" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="end">CAM_01</text>
  
  <!-- Alert Banner -->
  <rect x="180" y="330" width="240" height="40" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="300" y="355" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fca5a5" text-anchor="middle">⚠️ DROWSINESS DETECTED</text>
</svg>
