<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="devopsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0b0f19"/>

  <!-- Connected pipeline pipe -->
  <path d="M 60,200 L 540,200" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 60,200 L 380,200" stroke="url(#devopsGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Pipeline Stages -->
  <!-- Stage 1: Code -->
  <circle cx="100" cy="200" r="30" fill="#10b981" stroke="#0b0f19" stroke-width="4"/>
  <text x="100" y="204" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">CODE</text>
  <circle cx="120" cy="180" r="8" fill="#047857"/>
  <path d="M 117,180 L 119,182 L 123,178" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Stage 2: Build -->
  <circle cx="220" cy="200" r="30" fill="#10b981" stroke="#0b0f19" stroke-width="4"/>
  <text x="220" y="204" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">BUILD</text>
  <circle cx="240" cy="180" r="8" fill="#047857"/>
  <path d="M 237,180 L 239,182 L 243,178" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Stage 3: Test -->
  <circle cx="340" cy="200" r="30" fill="#10b981" stroke="#0b0f19" stroke-width="4"/>
  <text x="340" y="204" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">TEST</text>
  <circle cx="360" cy="180" r="8" fill="#047857"/>
  <path d="M 357,180 L 359,182 L 363,178" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Stage 4: Deploy -->
  <circle cx="460" cy="200" r="30" fill="#3b82f6" stroke="#0b0f19" stroke-width="4"/>
  <text x="460" y="204" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">DEPLOY</text>
  <!-- Loading spinner on Deploy -->
  <circle cx="480" cy="180" r="8" fill="#1d4ed8"/>
  <path d="M 480,175 A 5,5 0 0,1 485,180" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Pipeline details info text -->
  <text x="300" y="80" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">CI/CD PIPELINE STATUS: ACTIVE</text>
  
  <rect x="150" y="280" width="300" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="170" y="302" font-family="monospace" font-size="10" fill="#a7f3d0">&gt; npm run test: success (14 passes)</text>
  <text x="170" y="322" font-family="monospace" font-size="10" fill="#a7f3d0">&gt; docker build -t web-app:latest (done)</text>
</svg>
