<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="petGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0b0f19"/>

  <!-- Card Frame -->
  <rect x="180" y="60" width="240" height="280" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- Pet Photo Container -->
  <rect x="196" y="76" width="208" height="120" rx="10" fill="url(#petGrad)"/>
  
  <!-- Stylized animal ears/face drawing inside photo area -->
  <!-- Left Ear -->
  <path d="M 270,160 L 260,110 L 290,130 Z" fill="#4c0519"/>
  <!-- Right Ear -->
  <path d="M 330,160 L 340,110 L 310,130 Z" fill="#4c0519"/>
  <!-- Face/Muzzle circle -->
  <circle cx="300" cy="160" r="30" fill="#ffffff" opacity="0.95"/>
  <circle cx="290" cy="155" r="4" fill="#000000"/>
  <circle cx="310" cy="155" r="4" fill="#000000"/>
  <polygon points="296,163 304,163 300,168" fill="#e11d48"/>

  <!-- Bookmark Heart Symbol -->
  <circle cx="380" cy="96" r="14" fill="#0f172a" fill-opacity="0.8"/>
  <path d="M 380,102 L 376,98 A 3,3 0 0,1 380,94 A 3,3 0 0,1 384,98 Z" fill="#f43f5e"/>

  <!-- Pet Details -->
  <text x="196" y="225" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff">Milo</text>
  <text x="196" y="242" font-family="sans-serif" font-size="10" fill="#94a3b8">Golden Retriever Puppy • 3 months</text>

  <!-- Tags -->
  <rect x="196" y="260" width="60" height="18" rx="4" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-opacity="0.3"/>
  <text x="226" y="272" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fda4af" text-anchor="middle">Friendly</text>

  <rect x="264" y="260" width="65" height="18" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="296" y="272" font-family="sans-serif" font-size="8" font-weight="bold" fill="#a7f3d0" text-anchor="middle">Vaccinated</text>

  <!-- CTA Button inside card -->
  <rect x="196" y="295" width="208" height="28" rx="6" fill="#f43f5e"/>
  <text x="300" y="313" font-family="sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">Adopt Milo</text>
</svg>
