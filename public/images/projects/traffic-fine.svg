<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="tfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="#0b0f19"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05">
    <path d="M 0,50 L 600,50 M 0,100 L 600,100 M 0,150 L 600,150 M 0,200 L 600,200 M 0,250 L 600,250 M 0,300 L 600,300 M 0,350 L 600,350" stroke="#ffffff" stroke-width="1"/>
    <path d="M 50,0 L 50,400 M 100,0 L 100,400 M 150,0 L 150,400 M 200,0 L 200,400 M 250,0 L 250,400 M 300,0 L 300,400 M 350,0 L 350,400 M 400,0 L 400,400 M 450,0 L 450,400 M 500,0 L 500,400 M 550,0 L 550,400" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Speedometer shape -->
  <path d="M 150,280 A 120,120 0 0,1 450,280" stroke="#1e293b" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M 150,280 A 120,120 0 0,1 360,180" stroke="url(#tfGrad)" stroke-width="20" stroke-linecap="round" fill="none"/>

  <!-- Speed needle -->
  <line x1="300" y1="280" x2="350" y2="170" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="280" r="15" fill="#ffffff"/>

  <!-- Speed read-out -->
  <text x="300" y="320" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">120 KM/H</text>
  <text x="300" y="345" font-family="monospace" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="bold">VIOLATION DETECTED</text>

  <!-- Payment interface overlay card -->
  <rect x="380" y="40" width="180" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="400" y="60" width="140" height="20" rx="4" fill="#0f172a"/>
  <text x="410" y="74" font-family="monospace" font-size="10" fill="#10b981">FINE PAID: $150</text>
  <rect x="400" y="95" width="80" height="10" rx="2" fill="#475569"/>
  <rect x="400" y="115" width="100" height="10" rx="2" fill="#475569"/>
  <circle cx="530" cy="120" r="10" fill="#10b981"/>
  <path d="M 526,120 L 529,123 L 535,117" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Camera focal bracket -->
  <path d="M 40,40 L 80,40 M 40,40 L 40,80" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M 560,40 L 520,40 M 560,40 L 560,80" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M 40,360 L 80,360 M 40,360 L 40,320" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M 560,360 L 520,360 M 560,360 L 560,320" stroke="#ffffff" stroke-width="3" fill="none"/>
</svg>
