<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="doctorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0b0f19"/>

  <!-- Pulse Heartbeat line -->
  <path d="M 50,220 L 150,220 L 170,180 L 190,260 L 210,210 L 220,230 L 230,220 L 350,220 L 370,150 L 390,290 L 410,200 L 420,240 L 430,220 L 550,220" stroke="url(#doctorGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Doctor Badge/Card -->
  <rect x="200" y="50" width="200" height="100" rx="10" fill="#1e293b" stroke="#0d9488" stroke-width="2"/>
  <circle cx="250" cy="100" r="25" fill="#334155"/>
  <!-- Doctor avatar placeholder -->
  <path d="M 235,120 Q 250,105 265,120" stroke="#0d9488" stroke-width="3" fill="none"/>
  <circle cx="250" cy="95" r="10" fill="#0d9488"/>
  <text x="330" y="95" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">Dr. Alex Smith</text>
  <text x="330" y="115" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Cardiologist</text>

  <!-- Status / Channeling text -->
  <text x="300" y="330" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">CHANNELING STATUS: ACTIVE</text>
  <text x="300" y="355" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Centralized Healthcare Portal</text>
</svg>
