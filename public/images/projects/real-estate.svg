<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="reGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0b0f19"/>

  <!-- Simulated card container -->
  <rect x="150" y="60" width="300" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Image area inside card -->
  <rect x="170" y="80" width="260" height="130" rx="8" fill="url(#reGrad)"/>
  
  <!-- House vector drawing inside card image -->
  <path d="M 270,180 L 270,150 L 330,150 L 330,180 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 260,150 L 300,110 L 340,150 Z" fill="#312e81"/>
  <rect x="290" y="160" width="12" height="20" fill="#475569"/>

  <!-- Pricing label overlay -->
  <rect x="180" y="90" width="90" height="24" rx="6" fill="#0f172a" fill-opacity="0.8"/>
  <text x="225" y="106" font-family="sans-serif" font-weight="bold" font-size="11" fill="#c084fc" text-anchor="middle">$450,000</text>

  <!-- Title & details inside card -->
  <text x="175" y="240" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff">Grand Horizon Villa</text>
  <text x="175" y="260" font-family="sans-serif" font-size="10" fill="#94a3b8">Tech Boulevard, Silicon District</text>

  <!-- Specs icons representations -->
  <rect x="175" y="280" width="60" height="20" rx="4" fill="#0f172a"/>
  <text x="205" y="293" font-family="sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">4 Beds</text>

  <rect x="245" y="280" width="60" height="20" rx="4" fill="#0f172a"/>
  <text x="275" y="293" font-family="sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">3 Baths</text>

  <rect x="315" y="280" width="65" height="20" rx="4" fill="#0f172a"/>
  <text x="347" y="293" font-family="sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">3,200 sqft</text>

  <!-- Filter search header bar -->
  <rect x="60" y="15" width="480" height="30" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="34" font-family="sans-serif" font-size="10" fill="#64748b">Search by city, price range, or rooms...</text>
  <circle cx="515" cy="30" r="8" fill="#a855f7"/>
</svg>
