<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="#0b0f19"/>

  <!-- Connected lines background -->
  <g stroke="#1e293b" stroke-width="1.5">
    <line x1="80" y1="200" x2="220" y2="200"/>
    <line x1="220" y1="200" x2="380" y2="200"/>
    <line x1="380" y1="200" x2="520" y2="200"/>
    
    <line x1="220" y1="200" x2="300" y2="100"/>
    <line x1="380" y1="200" x2="300" y2="100"/>
    
    <line x1="220" y1="200" x2="300" y2="300"/>
    <line x1="380" y1="200" x2="300" y2="300"/>
  </g>

  <!-- Network Nodes -->
  <circle cx="300" cy="100" r="12" fill="#10b981" stroke="#0b0f19" stroke-width="3"/>
  <circle cx="300" cy="300" r="12" fill="#10b981" stroke="#0b0f19" stroke-width="3"/>

  <!-- Block 1 -->
  <rect x="50" y="150" width="100" height="100" rx="8" fill="url(#blockGrad)" stroke="#6366f1" stroke-width="2"/>
  <text x="100" y="195" font-family="monospace" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">BLOCK #01</text>
  <text x="100" y="215" font-family="monospace" font-size="8" fill="#e2e8f0" text-anchor="middle">HASH: 0000a7b8</text>

  <!-- Block 2 -->
  <rect x="250" y="150" width="100" height="100" rx="8" fill="url(#blockGrad)" stroke="#6366f1" stroke-width="2"/>
  <text x="300" y="195" font-family="monospace" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">BLOCK #02</text>
  <text x="300" y="215" font-family="monospace" font-size="8" fill="#e2e8f0" text-anchor="middle">HASH: 00003f9c</text>

  <!-- Block 3 -->
  <rect x="450" y="150" width="100" height="100" rx="8" fill="url(#blockGrad)" stroke="#6366f1" stroke-width="2"/>
  <text x="500" y="195" font-family="monospace" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">BLOCK #03</text>
  <text x="500" y="215" font-family="monospace" font-size="8" fill="#e2e8f0" text-anchor="middle">HASH: 00007e2d</text>

  <!-- Hash linking indicators -->
  <path d="M 160,200 L 240,200" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4 2"/>
  <path d="M 360,200 L 440,200" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4 2"/>

  <!-- Simulation console feedback -->
  <rect x="180" y="340" width="240" height="30" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
  <text x="300" y="358" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">&gt; Consensus synchronized (Proof of Work)</text>
</svg>
