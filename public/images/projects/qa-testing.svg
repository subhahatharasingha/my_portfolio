<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="qaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0b0f19"/>

  <!-- Browser window frame -->
  <rect x="100" y="50" width="400" height="260" rx="12" fill="#1e293b" stroke="#7c3aed" stroke-width="2"/>
  
  <!-- Browser top bar -->
  <path d="M 100,80 L 500,80" stroke="#334155" stroke-width="2"/>
  <circle cx="125" cy="65" r="6" fill="#ef4444"/>
  <circle cx="145" cy="65" r="6" fill="#f59e0b"/>
  <circle cx="165" cy="65" r="6" fill="#10b981"/>

  <!-- Test suite dashboard -->
  <text x="125" y="125" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">Automated Test Suites</text>

  <!-- Progress bar -->
  <rect x="125" y="145" width="350" height="20" rx="10" fill="#334155"/>
  <rect x="125" y="145" width="310" height="20" rx="10" fill="url(#qaGrad)"/>
  <text x="300" y="160" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">88% PASSED (412 / 468)</text>

  <!-- Console outputs -->
  <rect x="125" y="185" width="350" height="100" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="145" y="210" font-family="monospace" font-size="10" fill="#34d399">&gt; Running Selenium UI Tests: [OK]</text>
  <text x="145" y="230" font-family="monospace" font-size="10" fill="#34d399">&gt; API REST Assured: [OK] (120/120)</text>
  <text x="145" y="250" font-family="monospace" font-size="10" fill="#f87171">&gt; OWASP Security Scan: 2 warning issues found</text>
  <text x="145" y="270" font-family="monospace" font-size="10" fill="#818cf8">&gt; SonarQube quality gate passed</text>

  <!-- Big label text -->
  <text x="300" y="360" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">QA &amp; TEST AUTOMATION ENGINE</text>
</svg>
