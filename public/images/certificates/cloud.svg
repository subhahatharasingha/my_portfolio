<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200" fill="none">
  <rect width="100%" height="100%" fill="#0b0f19" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Outer border -->
  <rect x="8" y="8" width="284" height="184" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.3"/>
  <rect x="12" y="12" width="276" height="176" fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Certificate text -->
  <text x="150" y="45" font-family="serif" font-size="14" font-weight="bold" fill="#f3f4f6" text-anchor="middle">CERTIFICATE OF DEMO COMPLETION</text>
  <text x="150" y="65" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">THIS IS A FICTIONAL DEMO TO CONFIRM THAT</text>
  
  <text x="150" y="95" font-family="serif" font-size="18" font-style="italic" font-weight="bold" fill="#3b82f6" text-anchor="middle">Alex Johnson</text>
  
  <text x="150" y="120" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">HAS COMPLETED THE TRAINING CURRICULUM FOR</text>
  <text x="150" y="135" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS Cloud Infrastructure Architect (Mock)</text>

  <!-- Seal / Stamp -->
  <circle cx="240" cy="155" r="16" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Small cloud shape inside seal -->
  <path d="M 234,157 A 4,4 0 0,1 237,152 A 5,5 0 0,1 245,152 A 4,4 0 0,1 247,157 Z" fill="#3b82f6"/>

  <!-- Signatures -->
  <line x1="45" y1="160" x2="105" y2="160" stroke="#334155" stroke-width="1"/>
  <text x="75" y="172" font-family="sans-serif" font-size="6" fill="#64748b" text-anchor="middle">AUTHORIZED INSTRUCTOR</text>

  <line x1="125" y1="160" x2="185" y2="160" stroke="#334155" stroke-width="1"/>
  <text x="155" y="172" font-family="sans-serif" font-size="6" fill="#64748b" text-anchor="middle">REGISTRAR SIGNATURE</text>
</svg>
